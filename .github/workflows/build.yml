name: Fabriquer APK BiblioFaso

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generer le Gradle Wrapper si absent
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Compiler le fichier APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Mettre a disposition l'APK
        uses: actions/upload-artifact@v4
        with:
          name: BiblioFaso-Application-APK
          path: app/build/outputs/apk/debug/*.apk
